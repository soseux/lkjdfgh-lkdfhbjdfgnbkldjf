[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dota-predictor"
version = "0.1.0"
description = "Point-in-time data pipeline for professional Dota 2 match prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
dota-predictor = "dota_predictor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dota_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp", ".test-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
